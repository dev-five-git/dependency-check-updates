[package]
name = "dependency-check-updates-docker"
version = "0.1.15"
description = "Container image support (Dockerfile, Docker Compose) for dependency-check-updates"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords = ["dependency", "update", "docker", "container", "ncu"]
categories = ["development-tools"]

[lib]
name = "dependency_check_updates_docker"
path = "src/lib.rs"

[dependencies]
dependency-check-updates-core.workspace = true
reqwest.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["sync"] }
node-semver.workspace = true
tracing.workspace = true
futures.workspace = true

[dev-dependencies]
rstest.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
wiremock.workspace = true
rustls.workspace = true

[lints]
workspace = true
