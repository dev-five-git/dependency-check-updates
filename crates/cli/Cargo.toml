[package]
name = "dependency-check-updates"
version = "0.3.0"
description = "Fast multi-ecosystem dependency updater: package.json, Cargo.toml, pyproject.toml in a single CLI (like npm-check-updates for every language)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories = ["command-line-utilities", "development-tools"]
include = ["src/**", "tests/**", "data/**", "schemas/**", "Cargo.toml"]

[[bin]]
name = "dependency-check-updates"
path = "src/main.rs"

# Short alias — every `cargo install dependency-check-updates` user gets
# `dcu` for free. The stub lives in `src/bin/dcu.rs` (a separate file rather
# than sharing `src/main.rs`) to avoid Cargo's "file present in multiple
# build targets" warning.
[[bin]]
name = "dcu"
path = "src/bin/dcu.rs"

[dependencies]
dependency-check-updates-core.workspace = true
dependency-check-updates-node.workspace = true
dependency-check-updates-rust.workspace = true
dependency-check-updates-python.workspace = true
dependency-check-updates-github.workspace = true
dependency-check-updates-docker.workspace = true
rustls.workspace = true
clap.workspace = true
serde_json.workspace = true
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
futures.workspace = true
owo-colors.workspace = true
semver.workspace = true
indicatif.workspace = true
reqwest.workspace = true
toml_edit.workspace = true
regex = "1.12"
quick-xml = "0.39"
sha2 = "0.10"
sha1 = "0.10"
tempfile.workspace = true
fs2 = "0.4.3"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization"] }

[target.'cfg(unix)'.dependencies]
xattr = "1.6.1"

[dev-dependencies]
rstest.workspace = true
wiremock.workspace = true

[lints]
workspace = true
