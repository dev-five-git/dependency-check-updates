name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - LICENSE
      - "**/*.gitignore"
      - .editorconfig
  pull_request: null

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  project-regressions:
    uses: ./.github/workflows/project-regressions.yml

  test:
    name: Test
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
        platform:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false
      - name: Install maturin
        run: uv pip install maturin --system
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install dependencies
        run: bun install
      - name: Build
        run: bun run build
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test

  coverage-test:
    name: Coverage Test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: xd009642/tarpaulin:develop-nightly
      options: --security-opt seccomp=unconfined
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Build
        run: cargo check
      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: |
          # rust coverage issue
          echo 'max_width = 100000' > .rustfmt.toml
          echo 'tab_spaces = 4' >> .rustfmt.toml
          echo 'newline_style = "Unix"' >> .rustfmt.toml
          echo 'fn_call_width = 100000' >> .rustfmt.toml
          echo 'fn_params_layout = "Compressed"' >> .rustfmt.toml
          echo 'chain_width = 100000' >> .rustfmt.toml
          echo 'merge_derives = true' >> .rustfmt.toml
          echo 'use_small_heuristics = "Default"' >> .rustfmt.toml
          cargo fmt
          cargo tarpaulin --out Lcov Stdout --engine llvm --fail-under 100
      - name: Upload to codecov.io
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          files: lcov.info
        if: github.ref == 'refs/heads/main'

  # publish
  changepacks:
    name: changepacks
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    needs:
      - project-regressions
      - test
      - coverage-test
    steps:
      - uses: actions/checkout@v7
      - uses: changepacks/action@main
        id: changepacks
        with:
          publish: true
          publish_options: -l rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    outputs:
      changepacks: ${{ steps.changepacks.outputs.changepacks }}
      release_assets_urls: ${{ steps.changepacks.outputs.release_assets_urls }}
      pending_releases: ${{ steps.changepacks.outputs.pending_releases }}

  # node
  node-build:
    needs:
      - test
      - coverage-test
      - changepacks
    if: ${{ contains(needs.changepacks.outputs.changepacks, 'bridge/node/package.json') }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: x86_64-apple-darwin
            build: bun run build --target x86_64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            build: bun run build --target x86_64-pc-windows-msvc
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: bun run build --target x86_64-unknown-linux-gnu --use-napi-cross
          - host: macos-latest
            target: aarch64-apple-darwin
            build: bun run build --target aarch64-apple-darwin
    name: stable - ${{ matrix.settings.target }} - node@22
    runs-on: ${{ matrix.settings.host }}
    env:
      DEBUG: napi:*
      MACOSX_DEPLOYMENT_TARGET: "10.13"
      CARGO_INCREMENTAL: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.settings.target }}
      - uses: mlugg/setup-zig@v2
        if: ${{ contains(matrix.settings.target, 'musl') }}
        with:
          version: 0.14.1
      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        if: ${{ contains(matrix.settings.target, 'musl') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tool: cargo-zigbuild
      - name: Install dependencies
        run: bun install
      - name: Build
        run: ${{ matrix.settings.build }}
        shell: bash
        working-directory: bridge/node
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.settings.target }}
          path: |
            bridge/node/dependency-check-updates.*.node
          if-no-files-found: error
          retention-days: 1

  # python
  python-build:
    runs-on: ${{ matrix.runner }}
    if: ${{ contains(needs.changepacks.outputs.changepacks, 'bridge/python/pyproject.toml') }}
    needs:
      - test
      - coverage-test
      - changepacks
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux manylinux
          - runner: ubuntu-22.04
            target: x86_64
            manylinux: auto
            os: linux
          - runner: ubuntu-22.04
            target: x86
            manylinux: auto
            os: linux
          - runner: ubuntu-22.04
            target: aarch64
            manylinux: auto
            os: linux
          - runner: ubuntu-22.04
            target: armv7
            manylinux: auto
            os: linux
          - runner: ubuntu-22.04
            target: ppc64le
            manylinux: auto
            os: linux

          # Linux musllinux
          - runner: ubuntu-22.04
            target: x86_64
            manylinux: musllinux_1_2
            os: musllinux
          - runner: ubuntu-22.04
            target: x86
            manylinux: musllinux_1_2
            os: musllinux
          - runner: ubuntu-22.04
            target: aarch64
            manylinux: musllinux_1_2
            os: musllinux
          - runner: ubuntu-22.04
            target: armv7
            manylinux: musllinux_1_2
            os: musllinux

          # Windows
          - runner: windows-latest
            target: x64
            os: windows
          - runner: windows-latest
            target: x86
            os: windows

          # macOS
          - runner: macos-14
            target: x86_64
            os: macos
          - runner: macos-14
            target: aarch64
            os: macos
    steps:
      - uses: actions/checkout@v7
      - name: Build wheels
        uses: PyO3/maturin-action@main
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          working-directory: bridge/python
          manylinux: ${{ matrix.manylinux || '' }}
          before-script-linux: |
            # ring v0.17 requires __ARM_ARCH for ARM assembly;
            # older manylinux2014 cross-GCC does not define it.
            # These are target-specific, so harmless on non-ARM builds.
            export CFLAGS_aarch64_unknown_linux_gnu="${CFLAGS_aarch64_unknown_linux_gnu:-} -D__ARM_ARCH=8"
            export CFLAGS_armv7_unknown_linux_gnueabihf="${CFLAGS_armv7_unknown_linux_gnueabihf:-} -D__ARM_ARCH=7"
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: bridge/python/dist
          retention-days: 1

  node-publish:
    name: Node Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    needs:
      - changepacks
      - node-build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(needs.changepacks.outputs.changepacks, 'bridge/node/package.json') }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js for npm trusted publishing
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Ensure npm supports OIDC
        run: npm install -g 'npm@^11'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
        working-directory: bridge/node
      - name: create npm dirs
        run: bunx napi create-npm-dirs
        working-directory: bridge/node
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: bindings-*
          path: bridge/node/artifacts
      - name: Move artifacts
        run: bun run artifacts
        working-directory: bridge/node
      - name: List packages
        run: ls -R ./npm
        working-directory: bridge/node
      - name: Pack and verify every npm package
        run: bun run pack:publish "$RUNNER_TEMP/npm-publish"
        working-directory: bridge/node
      # Register all five @dependency-check-updates/cli* packages on npm with
      # GitHub owner dev-five-git, repository dependency-check-updates, workflow
      # filename CI.yml (case-sensitive), no environment, and npm publish allowed.
      # Publish the already verified tarballs: no token or lifecycle publisher.
      - name: Publish with npm trusted publishing
        shell: bash
        run: |
          set -euo pipefail
          publish_package() {
            local tarball="$1"
            local package_id
            package_id=$(tar -xOf "$tarball" package/package.json | node -e '
              const pkg = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
              process.stdout.write(`${pkg.name}@${pkg.version}`);
            ')
            # Resume partial publication or retry a failed release asset upload.
            if npm view "$package_id" version >/dev/null 2>&1; then
              echo "::notice::$package_id is already published; skipping."
              return
            fi
            npm publish "$tarball" --access public --ignore-scripts
          }
          for tarball in "$RUNNER_TEMP/npm-publish/native/"*.tgz; do
            publish_package "$tarball"
          done
          publish_package "$RUNNER_TEMP/npm-publish/cli/"*.tgz
        working-directory: bridge/node
      - name: Upload Asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_UPLOAD_URL: ${{ fromJson(needs.changepacks.outputs.release_assets_urls)['bridge/node/package.json'] }}
        run: bash .github/scripts/upload-release-assets.sh "$RELEASE_UPLOAD_URL" bridge/node/npm/*/dependency-check-updates.*.node

  python-publish:
    name: Python Publish
    runs-on: ubuntu-latest
    if: ${{ contains(needs.changepacks.outputs.changepacks, 'bridge/python/pyproject.toml') }}
    needs:
      - changepacks
      - python-build
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "wheels-*/*"
      - name: Publish to PyPI
        uses: PyO3/maturin-action@main
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --non-interactive --skip-existing wheels-*/*
      - name: List wheels
        run: ls -R .
      - name: Upload Asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_UPLOAD_URL: ${{ fromJson(needs.changepacks.outputs.release_assets_urls)['bridge/python/pyproject.toml'] }}
        run: bash .github/scripts/upload-release-assets.sh "$RELEASE_UPLOAD_URL" wheels-*/*.whl

  finalize-releases:
    name: Finalize published releases
    runs-on: ubuntu-latest
    needs: [changepacks, node-publish, python-publish, upload-assets]
    permissions:
      contents: write
    # Current changepacks creates durable draft receipts for downstream npm/PyPI
    # publishers. Publish those releases only after their packages and assets
    # are available; failed publication must leave the drafts recoverable.
    if: >-
      ${{ always() && github.ref == 'refs/heads/main'
          && needs.changepacks.result == 'success'
          && needs.changepacks.outputs.pending_releases != ''
          && needs.changepacks.outputs.pending_releases != '{}'
          && (needs.node-publish.result == 'success'
              || !contains(needs.changepacks.outputs.pending_releases, 'bridge/node/package.json'))
          && (needs.python-publish.result == 'success'
              || !contains(needs.changepacks.outputs.pending_releases, 'bridge/python/pyproject.toml'))
          && (needs.upload-assets.result == 'success'
              || !contains(needs.changepacks.outputs.changepacks, 'crates/cli/Cargo.toml')) }}
    steps:
      - uses: changepacks/action@main
        with:
          finalize_releases: ${{ needs.changepacks.outputs.pending_releases }}

  upload-assets:
    needs: changepacks
    if: ${{ contains(needs.changepacks.outputs.changepacks, 'crates/cli/Cargo.toml') }}
    permissions:
      contents: write
      id-token: write
    name: Upload Assets for ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            os: linux
            target: x86_64-unknown-linux-gnu
            binary_name: dependency-check-updates-linux-x86_64
            dcu_binary_name: dcu-linux-x86_64
          - platform: windows-2022
            os: windows
            target: x86_64-pc-windows-msvc
            binary_name: dependency-check-updates-windows-x86_64.exe
            dcu_binary_name: dcu-windows-x86_64.exe
          - platform: macos-14
            os: macos
            target: x86_64-apple-darwin
            binary_name: dependency-check-updates-darwin-x86_64
            dcu_binary_name: dcu-darwin-x86_64
          - platform: macos-14
            os: macos
            target: aarch64-apple-darwin
            binary_name: dependency-check-updates-darwin-arm64
            dcu_binary_name: dcu-darwin-arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          components: clippy, rustfmt
      - name: Build Rust binaries
        # The cli crate produces both `dependency-check-updates` and `dcu` from
        # one `cargo build -p dependency-check-updates` invocation — see the
        # two `[[bin]]` entries in crates/cli/Cargo.toml.
        run: cargo build --release --target ${{ matrix.target }} -p dependency-check-updates
      - name: Rename binaries
        shell: bash
        # Use bash on all platforms so the same conditional EXT works on
        # Windows runners (Git Bash is available there).
        run: |
          EXT=""
          if [ "${{ matrix.os }}" = "windows" ]; then EXT=".exe"; fi
          mv "target/${{ matrix.target }}/release/dependency-check-updates$EXT" "${{ matrix.binary_name }}"
          mv "target/${{ matrix.target }}/release/dcu$EXT" "${{ matrix.dcu_binary_name }}"
      - name: Upload Assets
        uses: owjs3901/upload-github-release-asset@main
        with:
          upload_url: ${{ fromJson(needs.changepacks.outputs.release_assets_urls)['crates/cli/Cargo.toml'] }}
          # Multi-line asset_path uploads every line as a separate asset; verified
          # against the same action's usage in the `node-publish` and
          # `python-publish` jobs above.
          asset_path: |
            ${{ matrix.binary_name }}
            ${{ matrix.dcu_binary_name }}
